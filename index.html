<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeoCalc — Modern & Intuitive</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="calculator-card">
    <header class="calc-header">
      <div class="window-dots">
        <span></span><span></span><span></span>
      </div>
      <span class="badge">PROD v1.1</span>
    </header>

    <div class="display-container">
      <div class="history-expr" id="historyDisplay"></div>
      <div class="main-screen" id="currentDisplay">0</div>
    </div>

    <div class="keypad">
      <!-- Row 1 -->
      <button class="btn btn-secondary" id="clearBtn">AC</button>
      <button class="btn btn-secondary" id="delBtn">DEL</button>
      <button class="btn btn-op" id="signBtn">±</button>
      <button class="btn btn-op" data-op="/">÷</button>

      <!-- Row 2 -->
      <button class="btn btn-num" data-val="7">7</button>
      <button class="btn btn-num" data-val="8">8</button>
      <button class="btn btn-num" data-val="9">9</button>
      <button class="btn btn-op" data-op="*">×</button>

      <!-- Row 3 -->
      <button class="btn btn-num" data-val="4">4</button>
      <button class="btn btn-num" data-val="5">5</button>
      <button class="btn btn-num" data-val="6">6</button>
      <button class="btn btn-op" data-op="-">−</button>

      <!-- Row 4 -->
      <button class="btn btn-num" data-val="1">1</button>
      <button class="btn btn-num" data-val="2">2</button>
      <button class="btn btn-num" data-val="3">3</button>
      <button class="btn btn-op" data-op="+">+</button>

      <!-- Row 5 -->
      <button class="btn btn-num" data-val="0">0</button>
      <button class="btn btn-num" data-val=".">.</button>
      <button class="btn btn-primary" id="equalsBtn">=</button>
    </div>
  </main>

  <script src="js/calculator.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
