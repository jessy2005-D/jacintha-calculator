<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathMatrix 3D — Engineering Grade Calculator</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Floating Mathematical Matrix Background -->
  <div class="math-canvas" id="mathCanvas"></div>

  <!-- 3D Isometric Viewport -->
  <div class="calc-3d-stage">
    <main class="calculator">
      <!-- HUD Header -->
      <div class="hud-bar">
        <div class="hud-title">
          <span class="hud-pulse"></span>
          MATHMATRIX 3D
        </div>
        <span class="hud-chip">PROD v2.0</span>
      </div>

      <!-- Display Screen -->
      <div class="screen">
        <div class="screen-history" id="historyDisplay"></div>
        <div class="screen-value" id="currentDisplay">0</div>
      </div>

      <!-- Tactile 3D Keypad -->
      <div class="keypad">
        <button class="key-3d key-fn" id="clearBtn"><div class="key-top">AC</div></button>
        <button class="key-3d key-fn" id="delBtn"><div class="key-top">⌫</div></button>
        <button class="key-3d key-op" id="signBtn"><div class="key-top">±</div></button>
        <button class="key-3d key-op" data-op="/"><div class="key-top">÷</div></button>

        <button class="key-3d key-num" data-val="7"><div class="key-top">7</div></button>
        <button class="key-3d key-num" data-val="8"><div class="key-top">8</div></button>
        <button class="key-3d key-num" data-val="9"><div class="key-top">9</div></button>
        <button class="key-3d key-op" data-op="*"><div class="key-top">×</div></button>

        <button class="key-3d key-num" data-val="4"><div class="key-top">4</div></button>
        <button class="key-3d key-num" data-val="5"><div class="key-top">5</div></button>
        <button class="key-3d key-num" data-val="6"><div class="key-top">6</div></button>
        <button class="key-3d key-op" data-op="-"><div class="key-top">−</div></button>

        <button class="key-3d key-num" data-val="1"><div class="key-top">1</div></button>
        <button class="key-3d key-num" data-val="2"><div class="key-top">2</div></button>
        <button class="key-3d key-num" data-val="3"><div class="key-top">3</div></button>
        <button class="key-3d key-op" data-op="+"><div class="key-top">+</div></button>

        <button class="key-3d key-num span-2" data-val="0"><div class="key-top">0</div></button>
        <button class="key-3d key-num" data-val="."><div class="key-top">.</div></button>
        <button class="key-3d key-eq" id="equalsBtn"><div class="key-top">=</div></button>
      </div>
    </main>
  </div>

  <script src="js/background.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/calculator.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
